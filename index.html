<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件下载</title>
    <style>
        /* 简单美化，让页面更美观 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .download-list {
            list-style: none;
        }
        .download-item {
            padding: 15px 20px;
            margin-bottom: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .download-item:hover {
            background: #e8e8e8;
        }
        .download-item a {
            display: block;
            text-decoration: none;
            color: #2563eb;
            font-size: 18px;
        }
        .download-item a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>文件下载列表</h1>
        <ul class="download-list">
            <!-- 这里是下载项，复制多份就能加多个下载链接 -->
            <li class="download-item">
                <!-- 把href改成你刚才复制的GitHub zip直链，文字改成你的文件名 -->
                <a href="LineStationMES.zip" download>LineStationMES.zip</a>
            </li>
            <li class="download-item">
                <a href="SemiconductorMESDemo.zip" download>SemiconductorMESDemo.zip</a>
            </li>
            <li class="download-item">
                <a href="Print3DHostDemo.zip" download>Print3DHostDemo.zip</a>
            </li>
            <li class="download-item">
                <a href="SemiconductorWaferStageDemo.Net8.zip" download>SemiconductorWaferStageDemo.Net8.zip</a>
            </li>
            <!-- 继续加更多下载项，复制上面的<li>块就行 -->
        </ul>
    </div>

</body>
</html>
