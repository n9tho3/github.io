<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目资源下载</title>
    <style>
        /* 基础变量 专业商务配色 */
        :root {
            --primary: #165DFF;
            --primary-dark: #0E42B3;
            --bg: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-title: #1D2129;
            --text-secondary: #4E5969;
            --text-hint: #86909C;
            --border: #C9CDD4;
            --item-bg: #FCFDFF;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 8px 24px rgba(22, 93, 255, 0.15);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0F172A;
                --card-bg: #1E293B;
                --text-title: #F1F5F9;
                --text-secondary: #CBD5E1;
                --text-hint: #94A3B8;
                --border: #334155;
                --item-bg: #273449;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft Yahei", sans-serif;
            background-color: var(--bg);
            min-height: 100vh;
            padding: 3rem 0;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .project-header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeIn 0.5s ease-out;
        }

        .project-header h1 {
            font-size: 2rem;
            color: var(--text-title);
            font-weight: 600;
            margin-bottom: 0.8rem;
        }

        .project-desc {
            font-size: 1rem;
            color: var(--text-hint);
            max-width: 600px;
            margin: 0 auto;
        }

        .download-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 2rem;
            animation: fadeInUp 0.6s ease-out;
        }

        .download-list {
            list-style: none;
            display: grid;
            gap: 1rem;
        }

        .download-item {
            background-color: var(--item-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .download-item:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .download-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.2rem;
            text-decoration: none;
            gap: 1rem;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .file-icon {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            background-color: rgba(22, 93, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 20px;
            flex-shrink: 0;
        }

        .file-name {
            font-size: 16px;
            color: var(--text-title);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .download-btn {
            padding: 8px 20px;
            background-color: var(--primary);
            color: #FFFFFF !important;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }

        .download-item:hover .download-btn {
            background-color: var(--primary-dark);
        }

        .file-type-tag {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            background-color: rgba(22, 93, 255, 0.08);
            color: var(--primary);
            margin-top: 4px;
            display: inline-block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 移动端适配 */
        @media (max-width: 640px) {
            body {
                padding: 1.5rem 0;
            }
            .project-header h1 {
                font-size: 1.5rem;
            }
            .download-card {
                padding: 1.2rem;
            }
            .download-link {
                flex-direction: column;
                align-items: flex-start;
            }
            .download-btn {
                align-self: flex-end;
            }
        }

        @media (prefers-color-scheme: dark) {
            .file-icon {
                background-color: rgba(22, 93, 255, 0.2);
            }
            .file-type-tag {
                background-color: rgba(22, 93, 255, 0.2);
            }
        }
    </style>
</head>
<body>
    <div class="container">

            <p class="project-desc">以下是整理好的项目源码与演示工程，点击对应下载按钮即可获取文件</p>
        </div>

        <!-- 下载列表卡片 -->
        <div class="download-card">

                            </div>
                        </div>

                <li class="download-item">

                                <span class="file-type-tag">半导体MES演示工程</span>
                            </div>
                        </div>
                        <span class="download-btn">立即下载</span>
                    </a>
                </li>

                <li class="download-item">
                    <a href="Print3DHostDemo.zip" class="download-link" download>
                        <div class="file-info">
                            <div class="file-icon">🗜️</div>
                            <div>
                                <div class="file-name">Print3DHostDemo.zip</div>
                                <span class="file-type-tag">3D打印主机演示</span>
                            </div>
                        </div>
                        <span class="download-btn">立即下载</span>
                    </a>
                </li>

                <li class="download-item">
                    <a href="SemiconductorWaferStageDemo.Net8.zip" class="download-link" download>
                        <div class="file-info">
                            <div class="file-icon">🗜️</div>
                            <div>
                                <div class="file-name">SemiconductorWaferStageDemo.Net8.zip</div>
                                <span class="file-type-tag">晶圆台演示 .NET8</span>
                            </div>
                        </div>
                        <span class="download-btn">立即下载</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

</body>
</html>
